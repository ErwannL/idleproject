<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classement · Idle RPG</title>
  <meta name="description" content="Classement des meilleurs aventuriers d'Idle RPG : étape, niveau et boss vaincus.">
  <link rel="icon" href="/assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#0d1528; --panel:#131e38; --panel-2:#1a2847; --gold:#f2b43a; --gold-soft:#ffd77a; --ice:#9fe0ff; --text:#eef3ff; --muted:#a9b6d3; --line:#3a4a72; }
    * { box-sizing: border-box; }
    body { margin:0; background: var(--navy) url('/assets/sky_far.png') center top / cover no-repeat fixed; color: var(--text); font: 16px/1.5 'Nunito', system-ui, sans-serif; overflow-x:hidden; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 32px 16px 48px; }
    a { color: var(--gold-soft); }
    h1 { font: 900 clamp(24px, 6vw, 44px)/1.1 'Nunito', sans-serif; text-transform: uppercase; color: var(--gold); text-align: center; margin: 0; text-shadow: 3px 3px 0 #7a3d00; }
    .sub { text-align: center; color: var(--ice); font-weight: 800; margin: 8px 0 24px; }
    .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
    .tab { font: 800 15px 'Nunito', sans-serif; color: var(--text); background: var(--panel-2); border: 2px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
    .tab[aria-selected="true"] { background: var(--gold); color: #2a1600; border-color: #7a3d00; }
    .board { background: linear-gradient(180deg, rgba(26,40,71,.96), rgba(19,30,56,.96)); border: 2px solid var(--gold); border-radius: 16px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--line); }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: rgba(0,0,0,.2); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }
    td.rank { font-weight: 900; color: var(--gold-soft); width: 64px; }
    tr.top1 td.rank { color: #ffd45c; }
    tr.top2 td.rank { color: #d9e2ef; }
    tr.top3 td.rank { color: #e0a06a; }
    td.pseudo { font-weight: 800; word-break: break-word; }
    .empty, .msg { text-align: center; color: var(--muted); padding: 28px 16px; }
    /* Bas de page sur un fond : il passait sur les îles du décor et devenait illisible. */
    .foot { text-align: center; color: var(--muted); font-size: 14px; margin: 22px auto 0; max-width: 640px; padding: 10px 14px; border-radius: 12px; background: rgba(13,21,40,.82); }
    .foot a { color: var(--muted); }
    @media (max-width: 560px) {
      th.hide-sm, td.hide-sm { display: none; }
      th, td { padding: 9px 8px; font-size: 14px; }
      td.rank { width: 36px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Classement</h1>
    <p class="sub">Les meilleurs aventuriers d'Idle RPG</p>
    <div class="tabs" role="tablist" aria-label="Catégorie">
      <button class="tab" role="tab" data-sort="stage" aria-selected="true">Étape max</button>
      <button class="tab" role="tab" data-sort="level" aria-selected="false">Niveau</button>
      <button class="tab" role="tab" data-sort="bosses" aria-selected="false">Boss vaincus</button>
    </div>
    <section class="board" aria-live="polite">
      <table>
        <thead><tr>
          <th>#</th><th>Pseudo</th><th class="num">Étape max</th><th class="num">Niveau</th><th class="num hide-sm">Boss</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="msg">Chargement…</td></tr></tbody>
      </table>
    </section>
    <p class="foot">Seuls les joueurs ayant choisi d'apparaître sont listés, et les nouvelles parties sont exclues.
      <a href="/">Retour à l'accueil</a> · <a href="/confidentialite.html">Confidentialité</a></p>
  </main>
  <script>
    const rows = document.getElementById('rows');
    const fmt = (n) => (n ?? 0).toLocaleString('fr-FR');
    let current = 'stage';

    function show(text) {
      rows.innerHTML = '';
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 5;
      td.className = 'msg';
      td.textContent = text;
      tr.append(td);
      rows.append(tr);
    }

    async function load(sort) {
      current = sort;
      document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.sort === sort)));
      show('Chargement…');
      try {
        const res = await fetch(`/api/leaderboard?sort=${sort}&limit=100`);
        if (!res.ok) throw new Error();
        const { players } = await res.json();
        if (sort !== current) return;
        if (!players.length) return show('Pas encore de joueurs classés. Soyez le premier !');
        rows.innerHTML = '';
        for (const p of players) {
          const tr = document.createElement('tr');
          if (p.rank <= 3) tr.className = `top${p.rank}`;
          const cells = [
            [String(p.rank), 'rank', ''],
            [p.pseudo, 'pseudo', ''],
            [p.stageLabel ?? fmt(p.maxStage), 'num', ''], // libellé du jeu : « 7-6 ×8 »
            [fmt(p.level), 'num', ''],
            [fmt(p.bossesDefeated), 'num', 'hide-sm'],
          ];
          for (const [text, cls, extra] of cells) {
            const td = document.createElement('td');
            td.textContent = text;
            td.className = [cls, extra].filter(Boolean).join(' ');
            tr.append(td);
          }
          rows.append(tr);
        }
      } catch {
        if (sort === current) show('Classement indisponible pour le moment.');
      }
    }

    document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => load(b.dataset.sort)));
    load('stage');
  </script>
</body>
</html>
