<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com https://data.jsdelivr.com https://ascendrya.com https://www.ascendrya.com https://games.unicorn-geological.ts.net">
  <title>Ascendrya</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="src/ui/style.css">
  <link rel="stylesheet" href="src/ui/themes.css">
  <link rel="stylesheet" href="src/ui/fit.css">
  <link rel="stylesheet" href="src/ui/showcase.css">
  <link rel="stylesheet" href="src/ui/economy.css"> <!-- v9.2.8 : invocation, boutique, événement -->
  <link rel="stylesheet" href="src/ui/audit103.css"> <!-- v10.3 : audit des parties 0 à 7 du plan 10.2 -->
  <link rel="stylesheet" href="src/ui/arena1031.css"> <!-- v10.3.1 : Arène sur la carte (fin de la partie 6) -->
  <link rel="stylesheet" href="src/ui/equip.css"> <!-- v10.3 : Équipement et Forge -->
  <link rel="stylesheet" href="src/ui/defauts1040.css"> <!-- v10.4 : petits défauts (partie 7) -->
  <link rel="stylesheet" href="src/ui/bastion.css"> <!-- v10.3 : le Bastion -->
  <link rel="stylesheet" href="src/ui/dungeons1031.css"> <!-- v10.3.1 : feuille de donjon (mécanique en image), portes -->
  <link rel="stylesheet" href="src/ui/skills1040.css"> <!-- v10.4 : Compétences (vignette 160 px, survol 48 px) -->
  <link rel="stylesheet" href="src/ui/page.css"> <!-- v10.4 : pages plein écran (Personnage, Forge…) -->
  <link rel="stylesheet" href="src/ui/dungeons1040.css"> <!-- v10.4 : donjons en bannières, page illustrée -->
  <link rel="stylesheet" href="src/ui/bastion104.css"> <!-- v10.4 (6) : le Bastion en page, tour de la scène -->
  <link rel="stylesheet" href="src/ui/hud106.css">
  <link rel="stylesheet" href="src/ui/rarity108.css">
  <link rel="stylesheet" href="src/ui/bastion108.css">
  <link rel="stylesheet" href="src/ui/layout109.css"> <!-- v10.9 : une place fixe pour chaque chose --> <!-- v10.8 : Âges du Bastion --> <!-- v10.8 : raretés Mythique, Astral, Ascendant --> <!-- v10.6 : quêtes et événements de l'écran de jeu, Marché des Lueurs -->
  <link rel="stylesheet" href="src/ui/mobile1012.css"> <!-- v10.12 : passe téléphone (prologue « film d'action », Équipement stable, écran de jeu) -->
  <link rel="stylesheet" href="src/ui/mobile-kit.css"> <!-- v10.12 : kit mobile (cadre, cartouche, onglets, cases, boutons, fiches) : tout sous #app.m-phone -->
  <link rel="stylesheet" href="src/ui/mobile-shop.css"> <!-- v10.12 : Invocation et Boutique en version téléphone -->
  <link rel="stylesheet" href="src/ui/mobile-hero.css"> <!-- v10.12 (lot 4) : Améliorations, Compétences, Talents, Forge sur téléphone -->
  <link rel="stylesheet" href="src/ui/mobile-team.css"> <!-- v10.12 : Compagnons, Bastion, Expéditions (téléphone) -->
  <link rel="stylesheet" href="src/ui/mobile-equip.css"> <!-- v10.12 : Équipement et fiche d'objet (téléphone) -->
  <link rel="stylesheet" href="src/ui/mobile-research.css"> <!-- v10.12 (finition) : Bastion › Recherches (téléphone) -->
  <link rel="stylesheet" href="src/ui/mobile-combat.css"> <!-- v10.12 : lot combat (Carte, Donjons, Arène, Défis, Événement) -->

  <link rel="stylesheet" href="src/ui/mobile-profile.css"> <!-- v10.12 : Carnet, Missions, Encyclopédie, Apparences, Boss, Classement, Guilde, Statistiques (téléphone) -->
  <link rel="stylesheet" href="src/ui/mobile-hud.css"> <!-- v10.13 (lot 8) : écran de combat téléphone (sous #app.m-phone) -->
  <link rel="stylesheet" href="src/ui/mobile-audit1013.css"> <!-- v10.13.1 : corrections du contrôle mobile (un seul doré, texte >= 11 px, rien de tronqué), en dernier -->
  <link rel="stylesheet" href="src/ui/desk-kit.css"> <!-- v10.13 : kit PC (cadre, cartouche, modes, cases, boutons, grilles d-cols*) : tout sous #app:not(.m-phone) -->
  <link rel="stylesheet" href="src/ui/desk-base.css"> <!-- v10.13 : Forge, Améliorations, Bastion (Carte, Ouvriers) sur PC : tout sous #app:not(.m-phone) -->
  <link rel="stylesheet" href="src/ui/desk-research.css"> <!-- v10.13 (§ 7) : Bastion › Recherches sur PC -->
  <link rel="stylesheet" href="src/ui/desk-talents.css"> <!-- v10.13 (lot 5) : Talents et Renaissance sur PC : tout sous #app:not(.m-phone) -->
  <link rel="stylesheet" href="src/ui/desk-skills.css"> <!-- v10.13 (lot 4) : Compétences sur PC -->
  <link rel="stylesheet" href="src/ui/desk-hud.css"> <!-- v10.13 (lot 8) : écran de combat PC (événements, carte de zone, quêtes, console du bas) -->
  <link rel="stylesheet" href="src/ui/desk-profile.css"> <!-- v10.13 (lot profil) : Paramètres, Classement, Guilde, Statistiques, Boss, Encyclopédie en kit sur PC -->
  <link rel="stylesheet" href="src/ui/desk-companions.css"> <!-- v10.13 (lot 6) : Équipe › Compagnons (PC) : bandeau, grille 7 colonnes, fiche toujours visible -->
  <link rel="stylesheet" href="src/ui/desk-shop.css"> <!-- v10.13 : Boutique, Invocation, Apparences (PC) -->
  <link rel="stylesheet" href="src/ui/desk-equip.css"> <!-- v10.13 (lot 3) : Héros › Équipement et fiche d'objet (PC) -->
  <link rel="stylesheet" href="src/ui/desk-activities.css"> <!-- v10.13 : Missions, Carnet, Carte, Donjons, Défis, Arène, Événement, Expéditions (PC) -->
</head>
<body>
  <!-- v9.2.6 : écran de chargement (cercle de runes PixelLab), effacé par src/ui/ui-vfx.js bootDone() -->
  <div id="boot" aria-hidden="true"><i class="boot-rune"></i><b>Ascendrya</b></div>
  <div id="app" class="layout-mini">
    <!-- v9.1.0 : 4 menus (onglets dans le panneau), barre verticale (en bas sur écran étroit). Chiffre fixe par menu. -->
    <nav id="tabs" aria-label="Menus">
      <button data-menu="hero"><img class="px" data-icon="menu_hero" alt=""><span>Héros</span><i class="badge badge-new hidden"></i><i class="badge hidden" id="badge-hero"></i><b class="badge-count hidden" id="count-hero"></b><i class="badge-better hidden" id="better-hero" title="Un objet meilleur t'attend">▲</i></button>
      <button data-menu="team"><img class="px" data-icon="menu_team" alt=""><span>Équipe</span><i class="badge badge-new hidden"></i><i class="badge hidden" id="badge-team"></i></button>
      <button data-menu="adventure" class="menu-center"><img class="px" data-icon="menu_adventure" alt=""><span>Combat</span><i class="badge badge-new hidden"></i><i class="badge hidden" id="badge-adventure"></i></button>
      <button data-menu="summon"><img class="px" data-icon="tab_summon" alt=""><span>Invocation</span><i class="badge badge-new hidden"></i><i class="badge hidden" id="badge-summon"></i></button>
      <button data-menu="shop"><img class="px" data-icon="top_shop" alt=""><span>Boutique</span><i class="badge badge-new hidden"></i><i class="badge hidden" id="badge-shop-tab"></i></button>
    </nav>
    <div id="content">
    <div id="main-col">
      <header id="topbar">
        <button class="icon-btn drawer-btn" id="drawer-btn" data-action="drawer" aria-label="Menu">☰<i class="badge hidden" id="badge-goals"></i></button>
        <button class="brand top-level" id="portrait" data-open="hero" title="Fiche du héros"><img class="px" data-icon="icon_hero" alt=""><b id="top-level">Niv. 1</b>
          <span class="top-xp" aria-hidden="true"><i id="top-xp"></i></span></button>
        <button class="chip chip-gold" data-currency="gold" title="Or"><img class="px" data-icon="coin" alt="Or"><span id="gold">0</span></button>
        <button class="chip chip-gem" data-currency="gems" title="Gemmes"><img class="px" data-icon="icon_gem" alt="Gemmes"><span id="gems">0</span></button>
        <div class="top-actions">
          <button class="icon-btn top-shop hidden" id="top-shop" data-open="shop" title="Boutique" aria-label="Boutique"><img class="px shop-top-ico" data-icon="top_shop" alt="" draggable="false"><i class="badge hidden" id="badge-shop"></i></button>
          <button class="icon-btn hidden" id="top-profile" data-menu-open="profile" title="Profil" aria-label="Profil"><img class="px" data-icon="top_profile" alt=""></button>
          <button class="icon-btn" data-open="options" title="Paramètres" aria-label="Paramètres"><img class="px" data-icon="top_settings" alt=""></button>
        </div>
      </header>
      <section id="play">
        <div id="stage-area">
          <canvas id="scene" aria-label="Combat"></canvas>
          <div id="boss-flash"></div>
          <button id="zone-card" data-open="campaign" title="Carte"><span id="zone-name"></span><span id="stage-pips"></span><span id="wave-frieze" aria-hidden="true"></span></button>
          <div id="boost-group"><button id="boost-toggle" class="scene-btn hidden" data-action="toggle-boosts" aria-expanded="false">⚡ Boosts</button>
            <div id="rush-bar"></div></div>
          <div id="skill-bar" class="hidden"></div>
          <span id="combo-chip" class="hidden"></span>
          <button id="goals-pill" class="hidden" data-action="session-goals" aria-label="Objectifs de session"></button>
          <button id="quest-banner" class="hidden" aria-label="Mission du jour"></button>
          <div id="gain-feed" aria-hidden="true"></div>
          <button id="bastion-tower" class="hidden" type="button" data-action="bastion-tower" title="Bastion" aria-label="Bastion"><img class="px" src="assets/ui/art104/scene_tower.png" alt="" draggable="false"><i class="bt-dot hidden"></i></button>
          <button id="rift-chip" class="scene-btn hidden" data-action="rift-open" title="Faille du jour">⏳ Faille du jour</button>
          <div id="next-unlock" role="status" class="hidden"><i id="next-unlock-fill"></i><span id="next-unlock-text"></span></div>
          <button id="weak-spot" class="hidden" data-action="weak-spot" aria-label="Point faible"></button>
          <button id="speed-toggle" class="scene-btn hidden" data-action="speed" title="Vitesse des combats">×1</button>
          <button id="auto-toggle" class="scene-btn" data-action="toggle-auto" title="Avancer automatiquement après chaque étape"></button>
          <div id="strip-bar">
            <span class="strip-gold"><img class="px" data-icon="coin" alt=""><b id="strip-gold">0</b></span><span id="strip-info" class="strip-gold"></span>
            <button class="strip-btn" data-action="strip-menu" title="Ouvrir le menu (la fenêtre s'agrandit vers la gauche)">☰</button>
            <button class="strip-btn" data-action="window-size" data-preset="standard" title="Agrandir la fenêtre">⤢</button>
          </div>
          <div id="scene-bottom">
            <span id="level-badge">Niv. 1</span>
            <div id="xp-bar"><div id="xp-fill"></div></div>
            <span id="hp-chip"><i id="hp-fill" aria-hidden="true"></i><img class="px" data-icon="icon_heart" alt="PV"><span id="hp">0</span></span>
          </div>
          <div id="banner" class="hidden"></div>
          <!-- v9.9 (K2) : Sceau d'action — le gros bouton qui change de texte (une seule consigne à la fois) -->
          <button id="next-action" class="hidden" type="button"><span class="na-icon" aria-hidden="true">›</span><span class="na-lines"><span id="next-action-text"></span><small id="next-action-why"></small></span><span class="na-finger hidden" aria-hidden="true">👇</span></button>
        </div>
        <div id="hud">
          <div id="progress"><div id="progress-fill"></div><i id="boss-timer" class="hidden"></i><span id="progress-text"></span></div>
          <div id="news" class="empty" title="Dernier événement"><span id="news-text">—</span></div>
          <button id="advance-btn" class="btn btn-primary small hidden" data-action="advance" title="Reprendre la progression">Avancer ▶</button>
          <button id="leave-mode" class="btn btn-danger small hidden" data-action="leave-mode" title="Revenir à la campagne"></button>
        </div>
      </section>
    </div>
    <aside id="panel" class="hidden">
      <header>
        <img id="panel-icon" class="px" alt="">
        <h2 id="panel-title"></h2>
        <i id="panel-crest" aria-hidden="true"></i>
        <span id="panel-extra"></span>
        <button id="panel-fold" class="btn small hidden" type="button" aria-label="Rétracter le panneau">▼</button>
        <button id="panel-help" class="btn small" aria-label="Comment ça marche ?">?<span class="help-word"> Aide</span></button>
        <button id="panel-close" class="btn small" aria-label="Fermer (Échap)">✕</button>
      </header>
      <div id="panel-subtabs"></div>
      <div id="panel-body"></div>
    </aside>
    </div>
    <div id="modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div id="modal-card"></div></div>
    <div id="live" class="sr-only" aria-live="polite"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
