<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com https://data.jsdelivr.com https://games.unicorn-geological.ts.net">
  <title>Ascendrya</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="src/ui/style.css">
  <link rel="stylesheet" href="src/ui/themes.css">
  <link rel="stylesheet" href="src/ui/fit.css">
  <link rel="stylesheet" href="src/ui/showcase.css">
  <link rel="stylesheet" href="src/ui/economy.css"> <!-- v9.2.8 : invocation, boutique, événement -->
</head>
<body>
  <!-- v9.2.6 : écran de chargement (cercle de runes PixelLab), effacé par src/ui/ui-vfx.js bootDone() -->
  <div id="boot" aria-hidden="true"><i class="boot-rune"></i><b>Ascendrya</b></div>
  <div id="app" class="layout-mini">
    <!-- v9.1.0 : 4 menus (onglets dans le panneau), barre verticale (en bas sur écran étroit). Chiffre fixe par menu. -->
    <nav id="tabs" aria-label="Menus">
      <button data-menu="hero"><img class="px" data-icon="icon_hero" alt=""><span>Héros</span><i class="badge badge-new hidden"></i><i class="badge hidden" id="badge-hero"></i><b class="badge-count hidden" id="count-hero"></b></button>
      <button data-menu="adventure"><img class="px" data-icon="icon_map" alt=""><span>Aventure</span><i class="badge badge-new hidden"></i><i class="badge hidden" id="badge-adventure"></i></button>
      <button data-menu="team"><img class="px" data-icon="icon_summon" alt=""><span>Équipe</span><i class="badge badge-new hidden"></i><i class="badge hidden" id="badge-team"></i></button>
      <button data-menu="goals"><img class="px" data-icon="icon_trophy" alt=""><span>Objectifs</span><i class="badge badge-new hidden"></i><i class="badge hidden" id="badge-goals"></i></button>
    </nav>
    <div id="content">
    <div id="main-col">
      <header id="topbar">
        <button class="brand top-level" id="portrait" data-open="hero" title="Fiche du héros"><img class="px" data-icon="icon_hero" alt=""><b id="top-level">Niv. 1</b>
          <span class="top-xp" aria-hidden="true"><i id="top-xp"></i></span></button>
        <button class="chip chip-gold" data-currency="gold" title="Or"><img class="px" data-icon="coin" alt="Or"><span id="gold">0</span></button>
        <button class="chip chip-gem" data-currency="gems" title="Gemmes"><img class="px" data-icon="icon_gem" alt="Gemmes"><span id="gems">0</span></button>
        <div class="top-actions">
          <button class="icon-btn" data-open="options" title="Paramètres" aria-label="Paramètres"><img class="px" data-icon="icon_gear" alt=""></button>
        </div>
      </header>
      <section id="play">
        <div id="stage-area">
          <canvas id="scene" aria-label="Combat"></canvas>
          <div id="boss-flash"></div>
          <button id="zone-card" data-open="campaign" title="Carte"><span id="zone-name"></span><span id="stage-pips"></span></button>
          <div id="boost-group"><button id="boost-toggle" class="scene-btn hidden" data-action="toggle-boosts" aria-expanded="false">⚡ Boosts</button>
            <div id="rush-bar"></div></div>
          <div id="skill-bar" class="hidden"></div>
          <button id="speed-toggle" class="scene-btn hidden" data-action="speed" title="Vitesse des combats">×1</button>
          <button id="auto-toggle" class="scene-btn" data-action="toggle-auto" title="Avancer automatiquement après chaque étape"></button>
          <div id="strip-bar">
            <span class="strip-gold"><img class="px" data-icon="coin" alt=""><b id="strip-gold">0</b></span>
            <button class="strip-btn" data-action="strip-menu" title="Ouvrir le menu (la fenêtre s'agrandit vers la gauche)">☰</button>
            <button class="strip-btn" data-action="window-size" data-preset="standard" title="Agrandir la fenêtre">⤢</button>
          </div>
          <div id="scene-bottom">
            <span id="level-badge">Niv. 1</span>
            <div id="xp-bar"><div id="xp-fill"></div></div>
            <span id="hp-chip"><img class="px" data-icon="icon_heart" alt="PV"><span id="hp">0</span></span>
          </div>
          <div id="banner" class="hidden"></div>
        </div>
        <div id="hud">
          <div id="progress"><div id="progress-fill"></div><span id="progress-text"></span></div>
          <div id="news" title="Dernier événement"><span id="news-text">—</span></div>
          <button id="advance-btn" class="btn btn-primary small hidden" data-action="advance" title="Reprendre la progression">Avancer ▶</button>
          <button id="leave-mode" class="btn btn-danger small hidden" data-action="leave-mode" title="Revenir à la campagne"></button>
        </div>
        <button id="next-action" class="hidden" type="button"><span class="na-icon" aria-hidden="true">›</span><span id="next-action-text"></span></button>
      </section>
    </div>
    <aside id="panel" class="hidden">
      <header>
        <img id="panel-icon" class="px" alt="">
        <h2 id="panel-title"></h2>
        <i id="panel-crest" aria-hidden="true"></i>
        <span id="panel-extra"></span>
        <button id="panel-fold" class="btn small hidden" type="button" aria-label="Rétracter le panneau">▼</button>
        <button id="panel-help" class="btn small" aria-label="Comment ça marche ?">?<span class="help-word"> Aide</span></button>
        <button id="panel-close" class="btn small" aria-label="Fermer (Échap)">✕</button>
      </header>
      <div id="panel-subtabs"></div>
      <div id="panel-body"></div>
    </aside>
    </div>
    <div id="modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div id="modal-card"></div></div>
    <div id="live" class="sr-only" aria-live="polite"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
