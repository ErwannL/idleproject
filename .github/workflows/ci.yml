name: CI

# Tests à chaque push et pull request (rapide, sans construire l'exe ni l'APK : voir windows-exe.yml).
on:
  push:
    branches: [main, master, 'claude/**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
