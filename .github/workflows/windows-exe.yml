name: Windows exe

# Release d'Ascendrya : construit l'installateur Windows (testé : lancement réel, sauvegarde, mise à jour d'une
# installation précédente) et l'APK Android, puis publie la release de la version de package.json (ex. v9.5.2).
# Déclenchée seulement à la demande (onglet Actions, « Run workflow ») ou par un tag v* : plus à chaque push
# (les tests de chaque push sont dans ci.yml). Aucun artefact Actions (quota de stockage) : chaque job envoie son
# fichier directement dans la release (brouillon créé au début, publié à la fin). Une release déjà publiée n'est
# jamais supprimée : ses fichiers sont remplacés.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la release en brouillon (si elle n'existe pas encore)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          # Notes de la version en cours seulement (l'historique complet dépasse la limite de GitHub : 125 000 caractères).
          awk '/^### Versions précédentes/{exit} {print}' docs/RELEASE_NOTES.md > notes.md
          echo "" >> notes.md
          echo "Historique complet : docs/RELEASE_NOTES.md" >> notes.md
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Ascendrya $VERSION" --notes-file notes.md

  build:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Intégrer le jeton de mise à jour (secret UPDATE_TOKEN, jamais dans le dépôt)
        shell: bash
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if [[ "$UPDATE_TOKEN" =~ ^[A-Za-z0-9_]{20,255}$ ]]; then
            printf "export const BUILT_IN_TOKEN = '%s';\n" "$UPDATE_TOKEN" > src/core/update-token.js
            echo "Jeton de mise à jour intégré."
          else
            echo "Pas de secret UPDATE_TOKEN : installateur sans jeton intégré."
          fi

      # v9.7.1 : exe signé si le certificat Windows est fourni (secrets WIN_CSC_LINK et WIN_CSC_KEY_PASSWORD), sinon
      # non signé (avertissement dans le journal).
      - name: Construire l'installateur Windows
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"; echo "exe signé."
          else export CSC_IDENTITY_AUTO_DISCOVERY=false; echo "::warning::Pas de certificat Windows : exe non signé."; fi
          npm run dist:win

      - name: Tester l'application (lancement réel, sauvegarde, relance)
        shell: bash
        run: node tools/desktop-smoke.mjs "dist/win-unpacked/Idle RPG.exe"

      - name: Tester la mise à jour depuis la version précédente installée
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: '9.2.9'
        run: |
          gh release download "v$PREVIOUS" --pattern "IdleRPG-$PREVIOUS-setup.exe" --dir previous
          VERSION="$(node -p "require('./package.json').version")"
          node tools/upgrade-smoke.mjs "previous/IdleRPG-$PREVIOUS-setup.exe" "dist/IdleRPG-${VERSION}-setup.exe" "$VERSION"
          # Ancienne installation « pour tous les utilisateurs » : la nouvelle doit la remplacer.
          node tools/upgrade-smoke.mjs "previous/IdleRPG-$PREVIOUS-setup.exe" "dist/IdleRPG-${VERSION}-setup.exe" "$VERSION" --all-users
          # Mise à jour comme depuis le jeu : installation pendant que l'ancienne version tourne, puis relance.
          node tools/upgrade-smoke.mjs "previous/IdleRPG-$PREVIOUS-setup.exe" "dist/IdleRPG-${VERSION}-setup.exe" "$VERSION" --live
          # Le vrai parcours du bouton « Mettre à jour » (installateur visible lancé par le jeu, relance, échec détecté).
          node tools/upgrade-smoke.mjs "previous/IdleRPG-$PREVIOUS-setup.exe" "dist/IdleRPG-${VERSION}-setup.exe" "$VERSION" --inapp

      - name: Envoyer l'installateur dans la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release upload "v$VERSION" "dist/IdleRPG-${VERSION}-setup.exe" --clobber

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Préparer le jeu pour Android
        run: |
          npm run build:web
          npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Maven Central refuse parfois des téléchargements (429, « Could not find ») : jusqu'à 4 essais.
          # v9.7.1 : APK de release signé avec la clé Android si elle est fournie ; sinon APK de debug (installable).
          for i in 1 2 3 4; do ./gradlew assembleRelease assembleDebug --no-daemon && exit 0; echo "Essai $i échoué, nouvel essai dans 60 s"; sleep 60; done
          exit 1

      # v9.7.1 : APK et AAB SIGNÉS obligatoires — secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Sans eux, la release s'arrête (jamais de fichier non signé publié).
      - name: Signer l'APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p dist
          if [ -z "$KS_B64" ]; then
            echo "::warning::Pas de clé Android : APK de debug (clé de test), installable mais pas pour Google Play."
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/IdleRPG-${VERSION}.apk"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > upload.jks
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks upload.jks --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" --out "dist/IdleRPG-${VERSION}.apk" aligned.apk
          "$BT/apksigner" verify "dist/IdleRPG-${VERSION}.apk"
          echo "APK signé." 

      # AAB (Google Play) : signé avec la clé d'envoi si les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD existent ; sinon AAB non signé (à signer avant l'envoi sur Play).
      - name: Construire l'AAB (Google Play)
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for i in 1 2 3 4; do ./gradlew bundleRelease --no-daemon && break; echo "Essai $i échoué, nouvel essai dans 60 s"; sleep 60; done
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > upload.jks
            jarsigner -keystore upload.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" "$AAB" "$KEY_ALIAS"
            echo "AAB signé."
          else
            echo "::warning::Pas de clé Android : AAB non signé."
          fi
          VERSION="$(node -p "require('../package.json').version")"
          cp "$AAB" "../dist/IdleRPG-${VERSION}.aab"

      - name: Envoyer l'APK dans la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release upload "v$VERSION" "dist/IdleRPG-${VERSION}.apk" "dist/IdleRPG-${VERSION}.aab" --clobber

  # AppImage Linux x64 + script d'installation ascendrya.sh (Linux et macOS).
  linux:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Intégrer le jeton de mise à jour (secret UPDATE_TOKEN, jamais dans le dépôt)
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if [[ "$UPDATE_TOKEN" =~ ^[A-Za-z0-9_]{20,255}$ ]]; then
            printf "export const BUILT_IN_TOKEN = '%s';\n" "$UPDATE_TOKEN" > src/core/update-token.js
          fi

      - name: Construire l'AppImage
        run: npm run dist:linux

      - name: Vérifier le script d'installation
        run: |
          bash -n tools/install/ascendrya.sh
          cp tools/install/ascendrya.sh dist/ascendrya.sh

      - name: Envoyer l'AppImage et le script dans la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -f "dist/IdleRPG-${VERSION}.AppImage"
          gh release upload "v$VERSION" "dist/IdleRPG-${VERSION}.AppImage" dist/ascendrya.sh --clobber

  # Mac universel (Intel + Apple Silicon), non signé et non notarisé.
  mac:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Intégrer le jeton de mise à jour (secret UPDATE_TOKEN, jamais dans le dépôt)
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if [[ "$UPDATE_TOKEN" =~ ^[A-Za-z0-9_]{20,255}$ ]]; then
            printf "export const BUILT_IN_TOKEN = '%s';\n" "$UPDATE_TOKEN" > src/core/update-token.js
          fi

      - name: Construire le zip Mac (non signé)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: Envoyer le zip dans la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -f "dist/IdleRPG-${VERSION}-mac.zip"
          gh release upload "v$VERSION" "dist/IdleRPG-${VERSION}-mac.zip" --clobber

  publish:
    needs: [build, android, linux, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier la release (exe, APK, AAB, AppImage, zip Mac et script présents)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_N="$(node -p "require('./package.json').version")"
          ASSETS="$(gh release view "v$VERSION_N" --json assets --jq '.assets[].name')"
          for f in "IdleRPG-${VERSION_N}-setup.exe" "IdleRPG-${VERSION_N}.apk" "IdleRPG-${VERSION_N}.aab" \
                   "IdleRPG-${VERSION_N}.AppImage" "IdleRPG-${VERSION_N}-mac.zip" "ascendrya.sh"; do
            echo "$ASSETS" | grep -qxF "$f" || { echo "::error::Fichier manquant dans la release : $f"; exit 1; }
          done
          VERSION="v$(node -p "require('./package.json').version")"
          awk '/^### Versions précédentes/{exit} {print}' docs/RELEASE_NOTES.md > notes.md # version en cours (limite GitHub : 125 000 caractères)
          echo "" >> notes.md
          echo "Historique complet : docs/RELEASE_NOTES.md" >> notes.md
          gh release edit "$VERSION" --draft=false --latest --target "$GITHUB_SHA" --title "Ascendrya $VERSION" --notes-file notes.md
