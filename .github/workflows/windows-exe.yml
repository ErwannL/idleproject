name: Windows exe

# Release d'Ascendrya : construit l'installateur Windows (testé : lancement réel, sauvegarde, mise à jour d'une
# installation précédente) et l'APK Android, puis publie la release de la version de package.json (ex. v9.5.2).
# Déclenchée seulement à la demande (onglet Actions, « Run workflow ») ou par un tag v* : plus à chaque push
# (les tests de chaque push sont dans ci.yml). Aucun artefact Actions (quota de stockage) : chaque job envoie son
# fichier directement dans la release (brouillon créé au début, publié à la fin). Une release déjà publiée n'est
# jamais supprimée : ses fichiers sont remplacés.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la release en brouillon (si elle n'existe pas encore)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Ascendrya $VERSION" --notes-file docs/RELEASE_NOTES.md

  build:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Intégrer le jeton de mise à jour (secret UPDATE_TOKEN, jamais dans le dépôt)
        shell: bash
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if [[ "$UPDATE_TOKEN" =~ ^[A-Za-z0-9_]{20,255}$ ]]; then
            printf "export const BUILT_IN_TOKEN = '%s';\n" "$UPDATE_TOKEN" > src/core/update-token.js
            echo "Jeton de mise à jour intégré."
          else
            echo "Pas de secret UPDATE_TOKEN : installateur sans jeton intégré."
          fi

      - name: Construire l'installateur Windows
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Tester l'application (lancement réel, sauvegarde, relance)
        shell: bash
        run: node tools/desktop-smoke.mjs "dist/win-unpacked/Idle RPG.exe"

      - name: Tester la mise à jour depuis la version précédente installée
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: '9.2.9'
        run: |
          gh release download "v$PREVIOUS" --pattern "IdleRPG-$PREVIOUS-setup.exe" --dir previous
          VERSION="$(node -p "require('./package.json').version")"
          node tools/upgrade-smoke.mjs "previous/IdleRPG-$PREVIOUS-setup.exe" "dist/IdleRPG-${VERSION}-setup.exe" "$VERSION"
          # Ancienne installation « pour tous les utilisateurs » : la nouvelle doit la remplacer.
          node tools/upgrade-smoke.mjs "previous/IdleRPG-$PREVIOUS-setup.exe" "dist/IdleRPG-${VERSION}-setup.exe" "$VERSION" --all-users
          # Mise à jour comme depuis le jeu : installation pendant que l'ancienne version tourne, puis relance.
          node tools/upgrade-smoke.mjs "previous/IdleRPG-$PREVIOUS-setup.exe" "dist/IdleRPG-${VERSION}-setup.exe" "$VERSION" --live
          # Le vrai parcours du bouton « Mettre à jour » (installateur visible lancé par le jeu, relance, échec détecté).
          node tools/upgrade-smoke.mjs "previous/IdleRPG-$PREVIOUS-setup.exe" "dist/IdleRPG-${VERSION}-setup.exe" "$VERSION" --inapp

      - name: Envoyer l'installateur dans la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release upload "v$VERSION" "dist/IdleRPG-${VERSION}-setup.exe" --clobber

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Préparer le jeu pour Android
        run: |
          npm run build:web
          npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Maven Central refuse parfois des téléchargements (429, « Could not find ») : jusqu'à 4 essais.
          for i in 1 2 3 4; do ./gradlew assembleDebug --no-daemon && exit 0; echo "Essai $i échoué, nouvel essai dans 60 s"; sleep 60; done
          exit 1

      - name: Renommer l'APK
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/IdleRPG-${VERSION}.apk"

      - name: Envoyer l'APK dans la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release upload "v$VERSION" "dist/IdleRPG-${VERSION}.apk" --clobber

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier la release (exe et APK présents)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release edit "$VERSION" --draft=false --latest
