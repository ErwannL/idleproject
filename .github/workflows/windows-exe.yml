name: Windows exe

# Release d'Ascendrya : construit l'installateur Windows (testé : lancement réel, sauvegarde, mise à jour d'une
# installation précédente) et l'APK Android, puis publie la release de la version de package.json (ex. v9.5.2).
# Déclenchée seulement à la demande (onglet Actions, « Run workflow ») ou par un tag v* : plus à chaque push
# (les tests de chaque push sont dans ci.yml). Les artefacts intermédiaires ne sont gardés qu'un jour : les fichiers
# téléchargeables restent dans les Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Intégrer le jeton de mise à jour (secret UPDATE_TOKEN, jamais dans le dépôt)
        shell: bash
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if [[ "$UPDATE_TOKEN" =~ ^[A-Za-z0-9_]{20,255}$ ]]; then
            printf "export const BUILT_IN_TOKEN = '%s';\n" "$UPDATE_TOKEN" > src/core/update-token.js
            echo "Jeton de mise à jour intégré."
          else
            echo "Pas de secret UPDATE_TOKEN : installateur sans jeton intégré."
          fi

      - name: Construire l'installateur Windows
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Tester l'application (lancement réel, sauvegarde, relance)
        shell: bash
        run: node tools/desktop-smoke.mjs "dist/win-unpacked/Idle RPG.exe"

      - name: Tester la mise à jour depuis la version précédente installée
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: '9.2.9'
        run: |
          gh release download "v$PREVIOUS" --pattern "IdleRPG-$PREVIOUS-setup.exe" --dir previous
          VERSION="$(node -p "require('./package.json').version")"
          node tools/upgrade-smoke.mjs "previous/IdleRPG-$PREVIOUS-setup.exe" "dist/IdleRPG-${VERSION}-setup.exe" "$VERSION"
          # Ancienne installation « pour tous les utilisateurs » : la nouvelle doit la remplacer.
          node tools/upgrade-smoke.mjs "previous/IdleRPG-$PREVIOUS-setup.exe" "dist/IdleRPG-${VERSION}-setup.exe" "$VERSION" --all-users
          # Mise à jour comme depuis le jeu : installation pendant que l'ancienne version tourne, puis relance.
          node tools/upgrade-smoke.mjs "previous/IdleRPG-$PREVIOUS-setup.exe" "dist/IdleRPG-${VERSION}-setup.exe" "$VERSION" --live
          # Le vrai parcours du bouton « Mettre à jour » (installateur visible lancé par le jeu, relance, échec détecté).
          node tools/upgrade-smoke.mjs "previous/IdleRPG-$PREVIOUS-setup.exe" "dist/IdleRPG-${VERSION}-setup.exe" "$VERSION" --inapp

      - name: Conserver l'installateur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: idle-rpg-windows
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 1

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Préparer le jeu pour Android
        run: |
          npm run build:web
          npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/IdleRPG-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: idle-rpg-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          # Release déjà publiée : on remplace seulement ses fichiers (jamais de suppression de release ni de tag).
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" assets/idle-rpg-windows/*-setup.exe assets/idle-rpg-android/*.apk --clobber
          else
            gh release create "$VERSION" assets/idle-rpg-windows/*-setup.exe assets/idle-rpg-android/*.apk \
              --target "$GITHUB_SHA" \
              --title "Ascendrya $VERSION" \
              --notes-file docs/RELEASE_NOTES.md \
              --latest
          fi
