name: Windows exe

# Construit Idle RPG pour Windows (exe portable + installateur), lance les
# exécutables pour les tester, puis publie la release correspondant à la version
# de package.json (ex. v1.0.0).
on:
  push:
    branches: [main, master, 'claude/**']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Construire les exe Windows
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Tester les exe (lancement réel, sauvegarde, relance)
        shell: bash
        run: node tools/desktop-smoke.mjs "dist/win-unpacked/Idle RPG.exe" dist/IdleRPG-*-portable.exe

      - name: Conserver les exe comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: idle-rpg-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publier la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          # La release suit toujours la dernière construction validée de cette version.
          gh release delete "$VERSION" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$VERSION" dist/*.exe \
            --target "$GITHUB_SHA" \
            --title "Idle RPG $VERSION" \
            --notes-file docs/RELEASE_NOTES.md
