<!doctype html><html><head><meta charset="utf-8">
<!-- v9.3.1 : icône et bannières réseaux (X, YouTube, Discord), rendues par tools/render-social.cjs (Playwright). -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #000; }
  .art { position: relative; overflow: hidden; font-family: 'Press Start 2P', monospace; }
  .bg { position: absolute; inset: 0 0 0 30%; background: url(bg-colosse.png) right 75% / cover; image-rendering: pixelated; filter: saturate(1.25) contrast(1.08); }
  .veil { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(8,10,30,.15), rgba(8,10,30,.75) 80%), linear-gradient(90deg, #0a0c1e 28%, rgba(10,12,30,.6) 45%, transparent 70%); }
  .logo { color: #f2b43a; text-shadow: 0 .08em 0 #7a3d00, 0 0 .5em rgba(255,190,70,.6); letter-spacing: .03em; }
  .tag { color: #fff; font-family: system-ui, sans-serif; font-weight: 800; text-shadow: 0 2px 10px #000; }
  .chip { display: inline-block; color: #9fe0ff; font-family: system-ui, sans-serif; font-weight: 800; border: 2px solid #33436d; background: rgba(7,11,25,.7); border-radius: 999px; }
  .px { image-rendering: pixelated; position: absolute; filter: drop-shadow(0 10px 16px rgba(0,0,0,.6)); }
  /* Icône */
  #icon { width: 1024px; height: 1024px; background: radial-gradient(circle at 50% 40%, #3b2a7a, #120c2e 70%); display: grid; place-items: center; }
  #icon .ring { position: absolute; inset: 40px; border-radius: 50%; border: 14px solid #f2b43a; box-shadow: 0 0 60px rgba(255,190,70,.6), inset 0 0 60px rgba(255,190,70,.35); }
  #icon .rays { position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg, rgba(255,215,120,.18) 0 6deg, transparent 6deg 18deg); border-radius: 50%; }
  #icon img { position: relative; height: 760px; image-rendering: pixelated; margin-top: 40px; filter: drop-shadow(0 18px 24px rgba(0,0,0,.7)); }
</style></head><body>
<div id="icon" class="art"><div class="rays"></div><div class="ring"></div><img src="../../../assets/hd/px/hero_knight.webp" alt=""></div>

<div id="x" class="art" style="width:1500px;height:500px">
  <div class="bg"></div><div class="veil"></div>
  <div style="position:absolute;left:330px;top:140px">
    <div class="logo" style="font-size:64px">ASCENDRYA</div>
    <div class="tag" style="font-size:34px;margin-top:22px">Build your team. Conquer your destiny.</div>
    <div class="chip" style="font-size:22px;padding:8px 18px;margin-top:20px">PC (Steam) &amp; Mobile · Pre-register now</div>
  </div>
</div>

<div id="youtube" class="art" style="width:2560px;height:1440px">
  <div class="bg" style="inset:0;background-position:center 70%"></div><div class="veil" style="background:radial-gradient(ellipse 45% 22% at 50% 50%, rgba(8,10,30,.85), rgba(8,10,30,.35) 100%)"></div>
  <div style="position:absolute;left:507px;top:509px;width:1546px;height:423px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
    <div class="logo" style="font-size:110px">ASCENDRYA</div>
    <div class="tag" style="font-size:44px;margin-top:26px">Build your team. Conquer your destiny.</div>
    <div class="chip" style="font-size:28px;padding:10px 24px;margin-top:22px">PC (Steam) &amp; Mobile · Pre-register now</div>
  </div>
</div>

<div id="discord" class="art" style="width:960px;height:540px">
  <div class="bg"></div><div class="veil"></div>
  <div style="position:absolute;left:48px;top:180px">
    <div class="logo" style="font-size:54px">ASCENDRYA</div>
    <div class="tag" style="font-size:24px;margin-top:18px">Build your team.<br>Conquer your destiny.</div>
  </div>
</div>
</body></html>
